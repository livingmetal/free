name: Build and verify APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: salarytimer-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Unit tests and release/debug/test builds
        run: gradle --no-daemon testDebugUnitTest assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Prepare unsigned release for existing owner's signing key
        run: |
          mkdir -p dist/toolchain dist/checks
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/SalaryTimer-v1.4.0-unsigned.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          cp "$BT/lib/apksigner.jar" "$BT/zipalign" dist/toolchain/
          "$BT/aapt2" dump badging dist/SalaryTimer-v1.4.0-unsigned.apk > dist/checks/package.txt
          "$BT/aapt2" dump permissions dist/SalaryTimer-v1.4.0-unsigned.apk > dist/checks/permissions.txt
          cp -r app/build/test-results/testDebugUnitTest dist/checks/unit-tests
      - name: Android 16 feature and migration tests
        run: bash scripts/test-v14.sh
      - name: Upload tested unsigned release for private local signing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SalaryTimer-v1.4.0-tested-build
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-v14
          path: |
            dist/checks/
            app/build/reports/tests/
          if-no-files-found: ignore
