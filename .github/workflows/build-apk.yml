name: Build and verify APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: salarytimer-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Build non-debuggable release
        run: gradle --no-daemon assembleRelease
      - name: Sign release and verify APK structure
        id: signing
        env:
          SALARY_KEYSTORE_BASE64: ${{ secrets.SALARY_KEYSTORE_BASE64 }}
          SALARY_KEYSTORE_PASSWORD: ${{ secrets.SALARY_KEYSTORE_PASSWORD }}
        run: bash scripts/sign-release.sh
      - name: Preserve signed candidate and encrypted owner backup before emulator tests
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SalaryTimer-v1.3.0-signed-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Retrieve old APKs for upgrade regression test
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35345896885 --repo livingmetal/free --name SalaryTimer-APK --dir old/v1
          gh run download 35346897128 --repo livingmetal/free --name SalaryTimer-APK --dir old/v12
      - name: Test installation and screens on Android 16
        if: steps.signing.outputs.signed == 'true'
        run: bash scripts/smoke-test.sh
      - name: Upload verified APK and owner-encrypted signing backup
        if: success() && steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SalaryTimer-v1.3.0-verified
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned build when signing key is not configured
        if: success() && steps.signing.outputs.signed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: UNSIGNED-not-installable
          path: dist/UNSIGNED-requires-existing-signing-key.apk
      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: dist/checks/
          if-no-files-found: ignore
